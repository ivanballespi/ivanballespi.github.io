<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivan Ballespi</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Syne', sans-serif; 
            background-color: #050505; 
            color: #fff;
            overflow: hidden; /* Mantiene la estética limpia en la landing */
        }
        
        /* Efecto de texto hueco que se rellena al pasar el ratón */
        .reveal-text {
            position: relative;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.3);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .reveal-text:hover {
            color: #fff;
            -webkit-text-stroke: 1px transparent;
            letter-spacing: 0.02em;
        }

        /* Orbes decorativos con desenfoque (Glow) */
        .floating-shape {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, #007cf0 0%, #00dfd8 100%);
            filter: blur(100px);
            opacity: 0.12;
            z-index: -1;
            animation: float 25s infinite alternate ease-in-out;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, -50px) scale(1.2); }
        }
    </style>
</head>
<body class="antialiased selection:bg-cyan-500 selection:text-white">

    <div class="floating-shape w-[500px] h-[500px] -top-20 -left-20"></div>
    <div class="floating-shape w-[400px] h-[400px] bottom-0 right-0" style="animation-delay: -5s; background: linear-gradient(135deg, #7928ca 0%, #ff0080 100%);"></div>

    <main class="h-screen flex flex-col justify-center px-8 md:px-24 py-12 relative">
        
        <div class="mb-8 flex items-center gap-3">

        </div>

        <h1 class="text-[12vw] md:text-[8vw] font-extrabold tracking-tighter leading-[0.85] mb-10">
            <span class="block">IVAN</span>
            <span class="block reveal-text">BALLESPI.</span>
        </h1>

       <p class="text-zinc-500 text-lg md:text-xl max-w-xl leading-relaxed mb-16 font-bold uppercase tracking-[0.2em]">
            Especializado en <span class="text-white">interfaces crudas</span> y sistemas que no se rompen. Enfocado en la ejecución, no en la narrativa.
        </p>
        
        <div class="flex flex-col md:flex-row gap-8 items-start md:items-center">
            
            <a href="experiencia.html" class="group flex items-center gap-4 text-2xl font-extrabold text-white transition-all">
                <span class="border-b-2 border-white/10 group-hover:border-cyan-500 pb-1 transition-colors">
                    Explorar Trayectoria
                </span>
                <div class="w-12 h-12 rounded-full border border-white/10 flex items-center justify-center group-hover:bg-white group-hover:text-black transition-all duration-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
                    </svg>
                </div>
            </a>

            <a href="proyectos.html" class="group text-2xl font-extrabold text-zinc-500 hover:text-white transition-all duration-300">
                <span class="italic">Ver Proyectos</span>
                <span class="ml-2 opacity-0 group-hover:opacity-100 transition-opacity text-cyan-500">↗</span>
            </a>

        </div>

        <div class="absolute bottom-12 left-8 md:left-24 flex gap-8">
            <a href="mailto:ivanballespi@proton.me" class="text-[10px] font-bold uppercase tracking-widest text-zinc-600 hover:text-white transition-colors">Email</a>
            <a href="https:/github.com/ivanballespi" class="text-[10px] font-bold uppercase tracking-widest text-zinc-600 hover:text-white transition-colors">GitHub</a>
        </div>

    </main>

</body>
</html>
